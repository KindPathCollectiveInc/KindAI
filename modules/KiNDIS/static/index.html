<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KiNDIS</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0d1a;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:1.5rem}
    h1{font-size:1.4rem;font-weight:600;color:#38bdf8;margin-bottom:1.5rem;letter-spacing:.03em}
    h2{font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin-bottom:.75rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem}
    .card{background:#0d1e2e;border:1px solid #1a3347;border-radius:10px;padding:1.2rem}
    .metric{font-size:2rem;font-weight:700;color:#38bdf8}
    .label{font-size:.75rem;color:#6b7280;margin-top:.25rem}
    form{display:flex;flex-direction:column;gap:.5rem}
    select,input,textarea{background:#1a2e3f;border:1px solid #2a4657;border-radius:6px;color:#e0e0e0;padding:.5rem .75rem;font-size:.85rem;width:100%}
    button{background:#0284c7;color:#fff;border:none;border-radius:6px;padding:.55rem 1.2rem;cursor:pointer;font-size:.85rem;font-weight:600}
    button:hover{background:#0369a1}
    button.sm{padding:.25rem .6rem;font-size:.72rem}
    .list{list-style:none;display:flex;flex-direction:column;gap:.35rem;max-height:300px;overflow-y:auto}
    .list li{background:#0d1e2e;border:1px solid #1a3347;border-radius:6px;padding:.5rem .75rem;font-size:.8rem}
    .tag{background:#0c4a6e;color:#38bdf8;border-radius:4px;padding:.1rem .4rem;font-size:.7rem}
    .alert{background:#7f1d1d;border:1px solid #dc2626;border-radius:6px;padding:.6rem .9rem;font-size:.8rem;color:#fca5a5;margin-bottom:1rem}
    #status{font-size:.75rem;color:#6b7280;margin-bottom:1rem}
  </style>
</head>
<body>

<h1>KiNDIS</h1>
<div id="status">Loading...</div>
<div id="alert-area"></div>

<div class="grid">
  <div class="card"><div class="metric" id="m-participants">—</div><div class="label">Participants</div></div>
  <div class="card"><div class="metric" id="m-notes">—</div><div class="label">Case Notes This Week</div></div>
  <div class="card"><div class="metric" id="m-billing">—</div><div class="label">Unbilled Items</div></div>
  <div class="card"><div class="metric" id="m-audit">—</div><div class="label">Recent Audits</div></div>
</div>

<div class="grid">
  <div class="card">
    <h2>Participants</h2>
    <ul class="list" id="participant-list"></ul>
    <form id="participant-form" style="margin-top:.75rem">
      <input id="p-name" type="text" placeholder="Full name" />
      <input id="p-ndis" type="text" placeholder="NDIS reference number" />
      <input id="p-dob" type="text" placeholder="Date of birth (YYYY-MM-DD)" />
      <button type="submit">Register Participant</button>
    </form>
  </div>

  <div class="card" style="grid-column:span 2">
    <h2>Add Case Note</h2>
    <form id="note-form">
      <select id="note-participant"></select>
      <select id="note-type">
        <option value="progress">Progress Note</option>
        <option value="incident">Incident Report</option>
        <option value="review">Plan Review</option>
        <option value="support">Support Note</option>
        <option value="contact">Contact Note</option>
        <option value="general">General</option>
      </select>
      <textarea id="note-content" rows="4" placeholder="Case note content..."></textarea>
      <button type="submit">Save Case Note</button>
    </form>
  </div>
</div>

<div class="card" style="margin-top:1rem">
  <h2>Recent Case Notes</h2>
  <ul class="list" id="note-list"></ul>
</div>

<script>
const API = '/api';

async function load() {
  const [health, participants, notes] = await Promise.all([
    fetch(`${API}/health`).then(r=>r.json()).catch(()=>null),
    fetch(`${API}/participants`).then(r=>r.json()).catch(()=>[]),
    fetch(`${API}/case-notes?limit=20`).then(r=>r.json()).catch(()=>[]),
  ]);

  if (health) {
    document.getElementById('status').textContent = 'KiNDIS ok';
    document.getElementById('m-participants').textContent = health.total_participants || 0;
  }

  // Populate participant select
  const sel = document.getElementById('note-participant');
  sel.innerHTML = participants.map(p=>`<option value="${p.id}">${p.name} (${p.ndis_number||'no ref'})</option>`).join('') || '<option>— register a participant first —</option>';

  const pList = document.getElementById('participant-list');
  pList.innerHTML = participants.map(p=>`<li><strong>${p.name}</strong>${p.ndis_number?' — NDIS: '+p.ndis_number:''}</li>`).join('') || '<li style="color:#6b7280">No participants yet.</li>';

  const nList = document.getElementById('note-list');
  nList.innerHTML = notes.length ? notes.map(n=>`<li>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span><span class="tag">${n.note_type}</span> ${n.content?.slice(0,80)}${(n.content?.length||0)>80?'…':''}</span>
      <a href="${API}/case-notes/${n.id}/export" target="_blank" style="color:#38bdf8;font-size:.7rem;margin-left:.5rem">Export</a>
    </div>
    <div style="font-size:.7rem;color:#6b7280;margin-top:.2rem">${n.date||n.created_at?.slice(0,10)||''}</div>
  </li>`).join('') : '<li style="color:#6b7280">No case notes yet.</li>';

  document.getElementById('m-notes').textContent = notes.length;
}

document.getElementById('participant-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = document.getElementById('p-name').value.trim();
  const ndis_number = document.getElementById('p-ndis').value.trim();
  const date_of_birth = document.getElementById('p-dob').value.trim();
  if (!name) return;
  await fetch(`${API}/participants`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name, ndis_number, date_of_birth})});
  document.getElementById('p-name').value=''; document.getElementById('p-ndis').value=''; document.getElementById('p-dob').value='';
  load();
});

document.getElementById('note-form').addEventListener('submit', async e => {
  e.preventDefault();
  const participant_id = parseInt(document.getElementById('note-participant').value);
  const note_type = document.getElementById('note-type').value;
  const content = document.getElementById('note-content').value.trim();
  if (!content || !participant_id) return;
  await fetch(`${API}/case-notes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({participant_id, note_type, content})});
  document.getElementById('note-content').value='';
  load();
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
