<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KindCreate</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #141414;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --muted: #666;
    --accent: #f5a623;
    --green: #4caf50;
    --red: #e05252;
    --blue: #5b9bd5;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "SF Mono", "Fira Code", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-left: auto;
  }
  .stats-row { display: flex; gap: 20px; font-size: 12px; color: var(--muted); }
  .stats-row strong { color: var(--text); }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr 300px;
    flex: 1;
    overflow: hidden;
  }
  .sidebar {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }
  .main { overflow-y: auto; padding: 20px; }
  .right-panel {
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
  }

  /* Sidebar */
  .sidebar-section { margin-bottom: 16px; }
  .sidebar-section h3 {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    padding: 0 14px 6px;
  }
  .sidebar-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    text-align: left;
  }
  .sidebar-btn:hover { background: var(--panel); }
  .sidebar-btn.active { background: var(--panel); color: var(--accent); }
  .sidebar-btn .icon { font-size: 14px; width: 18px; text-align: center; }
  .sidebar-btn .badge {
    margin-left: auto;
    background: var(--border);
    padding: 1px 6px;
    border-radius: 10px;
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* Project list */
  .project-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 10px;
    background: var(--panel);
    cursor: pointer;
    transition: border-color .15s;
  }
  .project-card:hover { border-color: var(--accent); }
  .project-card.selected { border-color: var(--accent); }
  .project-card h3 { font-size: 14px; margin-bottom: 4px; }
  .project-card .meta {
    display: flex; gap: 10px; font-size: 11px; color: var(--muted); margin-top: 6px;
  }
  .tag {
    display: inline-block;
    background: var(--border);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
  }
  .tag.music { color: var(--accent); }
  .tag.writing { color: var(--blue); }
  .tag.visual { color: var(--green); }

  /* Forms */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-header h2 { font-size: 16px; font-weight: 600; }
  button {
    padding: 7px 14px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-family: var(--font);
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #000; font-weight: 600; }
  .btn-secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-share { background: var(--blue); color: #fff; font-weight: 600; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  input, textarea, select {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 4px;
    font-family: var(--font);
    font-size: 13px;
    margin-bottom: 10px;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 100px; font-family: var(--mono); }
  label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Panels */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin-bottom: 12px; }
  .panel h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 10px; }

  /* Draft list */
  .draft-item {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .draft-item:hover { border-color: var(--accent); }
  .draft-item .version { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .draft-item .title { flex: 1; }
  .draft-item .mood { font-size: 11px; color: var(--muted); }

  /* Tool links */
  .tool-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 6px;
  }
  .tool-item a { color: var(--blue); text-decoration: none; font-size: 12px; }
  .tool-item a:hover { text-decoration: underline; }
  .tool-item .tool-name { flex: 1; font-size: 13px; }

  /* Analysis */
  .lsii-score {
    font-size: 36px;
    font-family: var(--mono);
    font-weight: 700;
    color: var(--accent);
    margin: 8px 0;
  }
  .lsii-label { font-size: 11px; color: var(--muted); }
  .analysis-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .analysis-row:last-child { border: none; }
  .analysis-row .val { font-family: var(--mono); color: var(--accent); }

  /* Toast */
  #toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 5px;
    font-size: 13px;
    opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* Overlay / modal */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    width: 440px;
    max-width: 90vw;
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px; }
</style>
</head>
<body>

<header>
  <h1><span>Kind</span>Create</h1>
  <div class="stats-row">
    <span>Projects: <strong id="hdr-projects">—</strong></span>
    <span>Drafts: <strong id="hdr-drafts">—</strong></span>
  </div>
  <div class="status-dot" id="status-dot" title="KindCreate active"></div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-section">
      <h3>Workspace</h3>
      <button class="sidebar-btn active" onclick="showView('projects')" id="nav-projects">
        <span class="icon">📁</span> Projects <span class="badge" id="badge-projects">0</span>
      </button>
      <button class="sidebar-btn" onclick="showView('newProject')" id="nav-new">
        <span class="icon">＋</span> New Project
      </button>
    </div>
    <div class="sidebar-section">
      <h3>Network</h3>
      <button class="sidebar-btn" onclick="showView('share')" id="nav-share">
        <span class="icon">📤</span> Share to KindSocials
      </button>
    </div>
    <div class="sidebar-section">
      <h3>System</h3>
      <button class="sidebar-btn" onclick="showView('health')" id="nav-health">
        <span class="icon">♥</span> Health
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main class="main" id="main-content">
    <!-- Renders dynamically -->
  </main>

  <!-- Right panel -->
  <aside class="right-panel" id="right-panel">
    <div class="panel">
      <h3>Status</h3>
      <div id="status-panel" style="font-size:12px;color:var(--muted)">Loading…</div>
    </div>
    <div class="panel" id="project-detail-panel" style="display:none">
      <h3>Selected Project</h3>
      <div id="project-detail-content"></div>
    </div>
  </aside>
</div>

<!-- New Project Modal -->
<div class="modal-overlay" id="modal-new-project">
  <div class="modal">
    <h2>New Project</h2>
    <label>Name</label>
    <input id="np-name" placeholder="Project name" />
    <label>Type</label>
    <select id="np-type">
      <option value="music">Music</option>
      <option value="writing">Writing</option>
      <option value="visual">Visual</option>
      <option value="code">Code</option>
      <option value="other">Other</option>
    </select>
    <label>Description (optional)</label>
    <input id="np-desc" placeholder="What is this about?" />
    <label>Tags (comma-separated)</label>
    <input id="np-tags" placeholder="ambient, experiment, 2025" />
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-new-project')">Cancel</button>
      <button class="btn-primary" onclick="submitNewProject()">Create</button>
    </div>
  </div>
</div>

<!-- New Draft Modal -->
<div class="modal-overlay" id="modal-new-draft">
  <div class="modal">
    <h2>Save Draft</h2>
    <label>Title</label>
    <input id="nd-title" placeholder="Draft title" />
    <label>Content</label>
    <textarea id="nd-content" placeholder="Write here…"></textarea>
    <div class="form-row">
      <div>
        <label>Mood (optional)</label>
        <input id="nd-mood" placeholder="focused, loose, uncertain…" />
      </div>
      <div>
        <label>Energy (0–1)</label>
        <input id="nd-energy" type="number" min="0" max="1" step="0.1" placeholder="0.7" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-new-draft')">Cancel</button>
      <button class="btn-primary" onclick="submitDraft()">Save Draft</button>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div class="modal-overlay" id="modal-share">
  <div class="modal">
    <h2>Share to KindSocials</h2>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px">
      This is the only automatic connection between KindCreate and KindSocials.
      Your work stays here until you choose to share it.
    </p>
    <label>Project</label>
    <select id="sh-project"></select>
    <label>Caption</label>
    <textarea id="sh-caption" style="min-height:70px" placeholder="What do you want to say about this?"></textarea>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-share')">Cancel</button>
      <button class="btn-share" onclick="submitShare()">Share ↗</button>
    </div>
  </div>
</div>

<!-- Add Tool Modal -->
<div class="modal-overlay" id="modal-add-tool">
  <div class="modal">
    <h2>Add Tool Link</h2>
    <label>Name</label>
    <input id="tl-name" placeholder="e.g. Logic Session — Track 01" />
    <label>Tool</label>
    <select id="tl-tool">
      <option value="logic">Logic Pro</option>
      <option value="ableton">Ableton Live</option>
      <option value="figma">Figma</option>
      <option value="notion">Notion</option>
      <option value="vscode">VS Code</option>
      <option value="reaper">REAPER</option>
      <option value="other">Other</option>
    </select>
    <label>URL (optional deep-link)</label>
    <input id="tl-url" placeholder="ableton://..." />
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-add-tool')">Cancel</button>
      <button class="btn-primary" onclick="submitToolLink()">Add</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '';
let _projects = [];
let _selectedProjectId = null;
let _currentView = 'projects';
let _draftProjectId = null;
let _toolProjectId = null;

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({detail: r.status})); throw new Error(e.detail || r.status); }
  return r.json();
}

function toast(msg, err) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = err ? 'var(--red)' : 'var(--accent)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── Nav ───────────────────────────────────────────────────────────────────────
function showView(view) {
  _currentView = view;
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  const navMap = {projects:'nav-projects', newProject:'nav-new', share:'nav-share', health:'nav-health'};
  if (navMap[view]) document.getElementById(navMap[view]).classList.add('active');
  renderMain();
}

async function renderMain() {
  const el = document.getElementById('main-content');
  if (_currentView === 'projects') await renderProjectList(el);
  else if (_currentView === 'newProject') renderNewProjectForm(el);
  else if (_currentView === 'projectDetail') await renderProjectDetail(el);
  else if (_currentView === 'share') renderShareView(el);
  else if (_currentView === 'health') await renderHealth(el);
}

// ── Projects ──────────────────────────────────────────────────────────────────
async function loadProjects() {
  const d = await api('GET', '/api/projects');
  _projects = d.projects || [];
  document.getElementById('badge-projects').textContent = _projects.length;
  document.getElementById('hdr-projects').textContent = _projects.length;
  document.getElementById('hdr-drafts').textContent = _projects.reduce((a,p)=>a+p.draft_count,0);
  return _projects;
}

async function renderProjectList(el) {
  await loadProjects();
  if (_projects.length === 0) {
    el.innerHTML = `<div class="empty">No projects yet.<br><br><button class="btn-primary" onclick="showView('newProject')">Create your first project</button></div>`;
    return;
  }
  el.innerHTML = `
    <div class="section-header">
      <h2>Projects</h2>
      <button class="btn-primary" onclick="showView('newProject')">+ New</button>
    </div>
    ${_projects.map(p => `
      <div class="project-card ${p.id===_selectedProjectId?'selected':''}" onclick="selectProject('${p.id}')">
        <h3>${esc(p.name)} <span class="tag ${p.type}">${p.type}</span></h3>
        ${p.description ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(p.description)}</div>` : ''}
        <div class="meta">
          <span>📄 ${p.draft_count} draft${p.draft_count===1?'':'s'}</span>
          <span>🔬 ${p.analysis_count} analysis</span>
          <span>${reltime(p.updated_at)}</span>
        </div>
      </div>
    `).join('')}
  `;
}

async function selectProject(id) {
  _selectedProjectId = id;
  _currentView = 'projectDetail';
  const nav = document.getElementById('nav-projects');
  nav.classList.add('active');
  renderMain();
}

async function renderProjectDetail(el) {
  const p = await api('GET', `/api/projects/${_selectedProjectId}`);
  el.innerHTML = `
    <div class="section-header">
      <h2>${esc(p.name)}</h2>
      <div style="display:flex;gap:8px">
        <button class="btn-secondary btn-sm" onclick="showView('projects')">← Back</button>
        <button class="btn-share btn-sm" onclick="openShareForProject('${p.id}')">Share ↗</button>
      </div>
    </div>
    <div style="margin-bottom:16px;color:var(--muted);font-size:13px">${esc(p.description||'')}</div>

    <!-- Drafts -->
    <div class="panel">
      <h3>Drafts (${p.drafts.length})
        <button class="btn-primary btn-sm" style="float:right;margin-top:-3px" onclick="openNewDraft('${p.id}')">+ Draft</button>
      </h3>
      ${p.drafts.length === 0 ? '<div class="empty" style="padding:12px">No drafts yet</div>' : ''}
      ${p.drafts.map(d => `
        <div class="draft-item">
          <span class="version">v${d.version}</span>
          <span class="title">${esc(d.title)}</span>
          ${d.mood ? `<span class="mood">${esc(d.mood)}</span>` : ''}
        </div>
      `).join('')}
    </div>

    <!-- Tool Links -->
    <div class="panel">
      <h3>Tool Links (${(p.tool_links||[]).length})
        <button class="btn-secondary btn-sm" style="float:right;margin-top:-3px" onclick="openAddTool('${p.id}')">+ Tool</button>
      </h3>
      ${(p.tool_links||[]).length === 0 ? '<div class="empty" style="padding:12px">No tools linked yet</div>' : ''}
      ${(p.tool_links||[]).map(t => `
        <div class="tool-item">
          <span class="tool-name">${esc(t.name)}</span>
          <span class="tag">${t.tool}</span>
          ${t.url ? `<a href="${esc(t.url)}" target="_blank">open ↗</a>` : ''}
        </div>
      `).join('')}
    </div>

    <!-- Analyses -->
    ${p.analyses && p.analyses.length > 0 ? `
    <div class="panel">
      <h3>Analyses (${p.analyses.length})</h3>
      ${p.analyses.map(a => `
        <div class="analysis-row"><span>LSII</span><span class="val">${a.lsii_score !== null ? a.lsii_score.toFixed(3) : '—'}</span></div>
        <div class="analysis-row"><span>Flag</span><span class="val">${a.lsii_flag}</span></div>
        <div class="analysis-row"><span>Era</span><span class="val">${a.era_fingerprint}</span></div>
        <div class="analysis-row"><span>File</span><span class="val" style="font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis">${a.filepath.split('/').pop()}</span></div>
      `).join('<hr style="border-color:var(--border);margin:8px 0">')}
    </div>
    ` : ''}

    <button class="btn-danger btn-sm" onclick="deleteProject('${p.id}')">Delete Project</button>
  `;

  // Right panel detail
  const rp = document.getElementById('project-detail-panel');
  rp.style.display = 'block';
  document.getElementById('project-detail-content').innerHTML = `
    <div style="font-size:12px">
      <div style="margin-bottom:6px"><strong>${esc(p.name)}</strong></div>
      <div style="color:var(--muted)">Type: ${p.type}</div>
      <div style="color:var(--muted)">Created: ${reltime(p.created_at)}</div>
      <div style="color:var(--muted)">Updated: ${reltime(p.updated_at)}</div>
      ${(p.tags||[]).length ? `<div style="margin-top:6px">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</div>` : ''}
    </div>
  `;
}

// ── New Project ───────────────────────────────────────────────────────────────
function renderNewProjectForm(el) {
  el.innerHTML = `
    <div class="section-header"><h2>New Project</h2></div>
    <div style="max-width:480px">
      <label>Name</label>
      <input id="f-name" placeholder="What are you making?" />
      <label>Type</label>
      <select id="f-type">
        <option value="music">Music</option>
        <option value="writing">Writing</option>
        <option value="visual">Visual</option>
        <option value="code">Code</option>
        <option value="other">Other</option>
      </select>
      <label>Description (optional)</label>
      <input id="f-desc" placeholder="What is this about?" />
      <label>Tags (comma-separated, optional)</label>
      <input id="f-tags" placeholder="ambient, experiment, 2025" />
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn-secondary" onclick="showView('projects')">Cancel</button>
        <button class="btn-primary" onclick="createProjectFromForm()">Create Project</button>
      </div>
    </div>
  `;
}

async function createProjectFromForm() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Project name required', true); return; }
  const tags = document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  try {
    const p = await api('POST', '/api/projects', {
      name,
      type: document.getElementById('f-type').value,
      description: document.getElementById('f-desc').value.trim() || null,
      tags,
    });
    toast(`Project "${p.name}" created`);
    _selectedProjectId = p.id;
    _currentView = 'projectDetail';
    renderMain();
  } catch(e) { toast(e.message, true); }
}

async function submitNewProject() {
  const name = document.getElementById('np-name').value.trim();
  if (!name) { toast('Name required', true); return; }
  const tags = document.getElementById('np-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  try {
    const p = await api('POST', '/api/projects', {
      name,
      type: document.getElementById('np-type').value,
      description: document.getElementById('np-desc').value.trim() || null,
      tags,
    });
    closeModal('modal-new-project');
    toast(`"${p.name}" created`);
    _selectedProjectId = p.id;
    _currentView = 'projectDetail';
    await renderMain();
  } catch(e) { toast(e.message, true); }
}

async function deleteProject(id) {
  if (!confirm('Delete this project?')) return;
  await api('DELETE', `/api/projects/${id}`);
  toast('Project deleted');
  _selectedProjectId = null;
  _currentView = 'projects';
  document.getElementById('project-detail-panel').style.display = 'none';
  renderMain();
}

// ── Drafts ────────────────────────────────────────────────────────────────────
function openNewDraft(projectId) {
  _draftProjectId = projectId;
  document.getElementById('nd-title').value = '';
  document.getElementById('nd-content').value = '';
  document.getElementById('nd-mood').value = '';
  document.getElementById('nd-energy').value = '';
  openModal('modal-new-draft');
}

async function submitDraft() {
  const title = document.getElementById('nd-title').value.trim();
  if (!title) { toast('Title required', true); return; }
  const energy = document.getElementById('nd-energy').value;
  try {
    await api('POST', `/api/projects/${_draftProjectId}/drafts`, {
      title,
      content: document.getElementById('nd-content').value,
      mood: document.getElementById('nd-mood').value.trim() || null,
      energy: energy ? parseFloat(energy) : null,
    });
    closeModal('modal-new-draft');
    toast('Draft saved');
    if (_currentView === 'projectDetail') renderMain();
  } catch(e) { toast(e.message, true); }
}

// ── Tool Links ────────────────────────────────────────────────────────────────
function openAddTool(projectId) {
  _toolProjectId = projectId;
  document.getElementById('tl-name').value = '';
  document.getElementById('tl-url').value = '';
  openModal('modal-add-tool');
}

async function submitToolLink() {
  const name = document.getElementById('tl-name').value.trim();
  if (!name) { toast('Name required', true); return; }
  try {
    await api('POST', `/api/projects/${_toolProjectId}/tools`, {
      name,
      tool: document.getElementById('tl-tool').value,
      url: document.getElementById('tl-url').value.trim() || null,
    });
    closeModal('modal-add-tool');
    toast('Tool linked');
    if (_currentView === 'projectDetail') renderMain();
  } catch(e) { toast(e.message, true); }
}

// ── Share ─────────────────────────────────────────────────────────────────────
function openShareForProject(projectId) {
  const sel = document.getElementById('sh-project');
  sel.innerHTML = _projects.map(p=>`<option value="${p.id}" ${p.id===projectId?'selected':''}>${esc(p.name)}</option>`).join('');
  document.getElementById('sh-caption').value = '';
  openModal('modal-share');
}

function renderShareView(el) {
  el.innerHTML = `
    <div class="section-header"><h2>Share to KindSocials</h2></div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:20px;max-width:480px">
      Sharing is always explicit. Your work stays here until you choose to push it to KindSocials.
    </div>
    <div style="max-width:480px">
      <label>Project</label>
      <select id="sh2-project">
        ${_projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
      </select>
      <label>Caption</label>
      <textarea id="sh2-caption" style="min-height:80px" placeholder="What do you want to say?"></textarea>
      <button class="btn-share" onclick="submitShareFromView()">Share to KindSocials ↗</button>
    </div>
  `;
}

async function submitShare() {
  const pid = document.getElementById('sh-project').value;
  if (!pid) { toast('Select a project', true); return; }
  try {
    await api('POST', '/api/share', {
      project_id: pid,
      caption: document.getElementById('sh-caption').value.trim() || null,
    });
    closeModal('modal-share');
    toast('Shared to KindSocials ✓');
  } catch(e) { toast(e.message, true); }
}

async function submitShareFromView() {
  const pid = document.getElementById('sh2-project').value;
  if (!pid) { toast('Select a project', true); return; }
  try {
    await api('POST', '/api/share', {
      project_id: pid,
      caption: document.getElementById('sh2-caption').value.trim() || null,
    });
    toast('Shared to KindSocials ✓');
    document.getElementById('sh2-caption').value = '';
  } catch(e) { toast(e.message, true); }
}

// ── Health ────────────────────────────────────────────────────────────────────
async function renderHealth(el) {
  const h = await api('GET', '/api/health');
  const m = await api('GET', '/api/module/identity');
  el.innerHTML = `
    <div class="section-header"><h2>Health</h2></div>
    <div class="panel">
      <h3>Module Identity</h3>
      ${Object.entries(m).map(([k,v])=>`<div class="analysis-row"><span>${k}</span><span class="val">${Array.isArray(v)?v.join(', '):v}</span></div>`).join('')}
    </div>
    <div class="panel">
      <h3>Runtime</h3>
      <div class="analysis-row"><span>Status</span><span class="val" style="color:var(--green)">${h.status}</span></div>
      <div class="analysis-row"><span>Uptime</span><span class="val">${Math.round(h.uptime)}s</span></div>
      ${Object.entries(h.checks).map(([k,v])=>`<div class="analysis-row"><span>${k}</span><span class="val">${v}</span></div>`).join('')}
    </div>
  `;
}

// ── Status panel ──────────────────────────────────────────────────────────────
async function refreshStatus() {
  try {
    const s = await api('GET', '/api/status');
    document.getElementById('status-panel').innerHTML = `
      <div class="analysis-row"><span>Projects</span><span class="val">${s.projects}</span></div>
      <div class="analysis-row"><span>Drafts</span><span class="val">${s.total_drafts}</span></div>
      <div class="analysis-row"><span>Tool links</span><span class="val">${s.tool_links}</span></div>
      <div class="analysis-row"><span>Analyser</span><span class="val" style="color:${s.analyser==='active'?'var(--green)':'var(--muted)'}">${s.analyser}</span></div>
    `;
  } catch { document.getElementById('status-dot').style.background = 'var(--red)'; }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function reltime(iso) {
  const d = new Date(iso);
  const diff = Date.now() - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.round(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.round(diff/3600000) + 'h ago';
  return Math.round(diff/86400000) + 'd ago';
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await loadProjects();
  await renderMain();
  await refreshStatus();
  setInterval(refreshStatus, 30000);
}
init();
</script>
